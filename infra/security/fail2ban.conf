[DEFAULT]
bantime  = 3600
findtime = 600
maxretry = 5
backend  = systemd

[nginx-http-auth]
enabled = true

[nginx-limit-req]
enabled  = true
port     = http,https
logpath  = /var/log/nginx/error.log
maxretry = 10

[nginx-botsearch]
enabled  = true
port     = http,https
logpath  = /var/log/nginx/access.log
maxretry = 2

[api-brute-force]
enabled   = true
port      = http,https
filter    = api-brute-force
logpath   = /var/log/nginx/access.log
maxretry  = 10
findtime  = 300
bantime   = 7200
