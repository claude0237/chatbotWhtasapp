# ModSecurity WAF Configuration (OWASP Core Rule Set)

SecRuleEngine On
SecRequestBodyAccess On
SecRequestBodyLimit 52428800
SecRequestBodyNoFilesLimit 1048576
SecResponseBodyAccess Off

# Logging
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLog /var/log/modsecurity/audit.log
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial

# OWASP CRS rules inclusion
Include /etc/nginx/modsecurity/crs/crs-setup.conf
Include /etc/nginx/modsecurity/crs/rules/*.conf

# Custom exclusions for API
SecRuleUpdateActionById 920170 "pass"

# Whitelist internal health checks
SecRule REMOTE_ADDR "@ipMatch 127.0.0.1,::1" \
    "id:1000,phase:1,pass,nolog,ctl:ruleEngine=Off"
